name: Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  push_api:
    name: Build & push API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bookme-ai-api:latest
            ${{ secrets.DOCKER_USERNAME }}/bookme-ai-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push_web:
    name: Build & push Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_AUTH_DISABLED=${{ vars.VITE_AUTH_DISABLED || 'false' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bookme-ai-web:latest
            ${{ secrets.DOCKER_USERNAME }}/bookme-ai-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
