# =============================================================================
# BookMe AI — Runtime Parameters
# =============================================================================
# Edit behaviour here WITHOUT touching code. Loaded by infrastructure/config.py.
# Secrets (API keys, endpoints with credentials) live ONLY in .env.
# =============================================================================

# ── Provider selection ───────────────────────────────────────────────────────
provider:
  # Active provider: "openai" (default, only needs OPENAI_API_KEY),
  # "openrouter", or "groq". Must match a top-level key in models.yaml.
  default: openai
  # Model tier to pull from models.yaml: "general" or "strong".
  tier: general
  # OpenAI-compatible base URLs per provider (keys come from .env).
  openrouter_base_url: https://openrouter.ai/api/v1
  groq_base_url: https://api.groq.com/openai/v1

# ── LLM defaults (BookMe AI hybrid) ─────────────────────────────────────────
llm:
  temperature: 0.0
  max_tokens: 1500
  streaming: false
  max_retries: 2
  request_timeout: 30
  enable_fallback: true
  fallback_tier: general
  # OpenAI gpt-4o-mini for routing / guardrail / agents; native Gemini for multi-route merge.
  roles:
    router:
      provider: openai
      tier: general
    guardrail:
      provider: openai
      tier: general
    extractor:
      provider: openai
      tier: general
    chat:
      provider: openai
      tier: general
    merge:
      provider: google
      tier: general
    fast_chat:
      provider: openai
      tier: general

# ── External travel services (the "third-party" the MCP servers bridge to) ────
# These are the existing Convex endpoints the baseline already used. The MCP
# hotel/flight servers call these; agents never touch them directly.
services:
  hotels_base_url: https://standing-fish-574.convex.site/hotels
  flights_base_url: https://standing-fish-574.convex.site/flights
  # Per-request HTTP settings for the tool layer (E3 resilience).
  http_timeout: 15        # seconds
  http_max_retries: 3     # tenacity retries on timeout / 5xx
  http_backoff_seconds: 0.5

# ── Tavily API configuration ──────────────────────────────────────────────────
tavily:
  search_url: https://api.tavily.com/search
  max_results: 5
  search_depth: basic
  include_answer: true

# ── MCP configuration ─────────────────────────────────────────────────────────
mcp:
  # "stdio" launches each server as a subprocess (default).
  transport: stdio

# ── Conversation memory (per-session, kills the global-history bug) ───────────
session:
  max_turns: 30           # rolling window kept per session_id
  history_window: 10       # recent (user, assistant) pairs fed to the router

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO             # DEBUG, INFO, WARNING, ERROR

# ── Observability (LangFuse) ──────────────────────────────────────────────────
observability:
  enabled: true         # tracing (@observe spans) — set true + LANGFUSE_* in .env
  # Prompt Management: also set LANGFUSE_PROMPTS=true in .env (or enable below).
  # When on, prompts load from LangFuse dashboard; local fallbacks if missing.
  prompts_enabled: false
  prompt_cache_ttl_seconds: 300   # client-side cache; bump prompt version in LangFuse to refresh
